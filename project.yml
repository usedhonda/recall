name: recall
include:
  - path: .local/project.yml
    required: false
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.12.6"
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    exactVersion: "0.7.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

schemes:
  recall:
    build:
      targets:
        recall: all
        recallTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - recallTests

targets:
  recall:
    type: application
    platform: iOS
    sources:
      - recall
      - Shared
    entitlements:
      path: recall/Resources/recall.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.networking.wifi-info: true
        com.apple.security.application-groups:
          - group.com.example.recall
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recall
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SDKROOT: iphoneos
        SUPPORTS_MACCATALYST: false
        SWIFT_OBJC_BRIDGING_HEADER: recall/recall-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: "YES"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: MediaPlayer.framework
      - sdk: Photos.framework
      - target: RecordingControl
        embed: true
    info:
      path: recall/Resources/Info.plist
      properties:
        CFBundleDisplayName: recall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "recall continuously records audio for lifelogging. Only voice segments are saved."
        NSLocalNetworkUsageDescription: "Connect to VoiceLog server on local network for audio upload."
        NSLocationWhenInUseUsageDescription: "recall uses your location for lifelogging telemetry."
        NSLocationAlwaysAndWhenInUseUsageDescription: "recall tracks your location in the background for continuous lifelogging."
        NSHealthShareUsageDescription: "recall reads health data (steps, heart rate, sleep, workouts) for lifelogging telemetry."
        NSHealthUpdateUsageDescription: "recall does not write any health data."
        NSPhotoLibraryUsageDescription: "recall imports photos and videos taken with your Ray-Ban Meta smart glasses to your lifelog. Other photos are not uploaded."
        NSBluetoothAlwaysUsageDescription: "recall connects to Meta AI glasses for local wearable experiments."
        MWDAT:
          DAMEnabled: true
          Analytics:
            OptOut: true
        UIBackgroundModes:
          - audio
          - location
        NSCameraUsageDescription: "recall uses the camera to scan QR codes for server configuration."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionRequiresForwardSecrecy: false
              NSIncludesSubdomains: true

  recallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/recallTests
    dependencies:
      - target: recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recallTests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/recall.app/recall"
        BUNDLE_LOADER: "$(TEST_HOST)"

  RecordingControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - RecordingControl
      - Shared
    entitlements:
      path: RecordingControl/RecordingControl.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.recall.RecordingControl
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.9"
    info:
      path: RecordingControl/Info.plist
      properties:
        CFBundleDisplayName: RecordingControl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
